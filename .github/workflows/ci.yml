name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.python }})
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 3.9 用 Apple 命令行工具自带的 /usr/bin/python3：macOS 用户实际在用的版本（setup-python 已没有可装的 3.9）。
      - name: Python 3.9（Apple 命令行工具）
        if: matrix.python == '3.9'
        run: |
          mkdir -p "$RUNNER_TEMP/py39"
          ln -s /usr/bin/python3 "$RUNNER_TEMP/py39/python3"
          echo "$RUNNER_TEMP/py39" >> "$GITHUB_PATH"
      - name: Python 3.10
        if: matrix.python == '3.10'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'

      - name: 核对 Python 版本
        env:
          WANT_PYTHON: ${{ matrix.python }}
        run: python3 -c 'import os, sys; want = tuple(map(int, os.environ["WANT_PYTHON"].split("."))); print(sys.executable, sys.version.split()[0]); sys.exit(sys.version_info[:2] != want)'

      # 只用仓库内的虚构 fixture；不读取、不访问任何真实 kb 知识库。
      - name: 单元测试
        run: python3 -m unittest discover -s tests
      - name: 清单检查
        run: python3 -B scripts/check-manifests.py
