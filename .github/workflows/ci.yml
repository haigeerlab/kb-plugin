name: CI

on:
  pull_request:
  push:
    branches: [main]

# 顶层不给任何权限（插件开发规范 C8），每个任务单独放权。
permissions: {}

jobs:
  test:
    name: test (${{ matrix.python }})
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.14']
    defaults:
      run:
        shell: bash
    # 测试会在临时仓库里提交，再对目录做快照或删除；runner 上 git 的后台自动维护会临时写
    # .git/objects/maintenance.lock，与之竞争导致误报。对本 job 的所有 git 进程关掉自动维护。
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: maintenance.auto
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: gc.auto
      GIT_CONFIG_VALUE_1: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 3.9 用 Apple 命令行工具自带的 /usr/bin/python3：macOS 用户实际在用的版本（setup-python 已没有可装的 3.9）。
      - name: Python 3.9（Apple 命令行工具）
        if: matrix.python == '3.9'
        run: |
          mkdir -p "$RUNNER_TEMP/py39"
          ln -s /usr/bin/python3 "$RUNNER_TEMP/py39/python3"
          echo "$RUNNER_TEMP/py39" >> "$GITHUB_PATH"
      - name: Python 3.14
        if: matrix.python == '3.14'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: 核对 Python 与 git 版本
        env:
          WANT_PYTHON: ${{ matrix.python }}
        run: |
          git --version
          git config --get maintenance.auto
          python3 -c 'import os, sys; want = tuple(map(int, os.environ["WANT_PYTHON"].split("."))); print(sys.executable, sys.version.split()[0]); sys.exit(sys.version_info[:2] != want)'

      # 统一检查入口（清单检查、本机路径检查、全部单元测试）。只用仓库内的虚构 fixture，不读取、不访问任何真实 kb 知识库。
      - name: 全量检查
        run: bash scripts/validate.sh
      # 插件开发规范 C10：检查跑完后，已跟踪文件不应被改动。
      - name: 工作区未被检查改动
        run: git diff --exit-code

  # 插件开发规范 C7：用 Claude Code 自带的校验检查 marketplace 与插件清单、skills。
  # 版本钉死（发布满两周的版本），安装照 anthropics/claude-plugins-official 的做法重试。
  # 注意：validate 不检查 frontmatter 的 YAML 能否解析，该项由 autopilot-hub 的共享检查负责（影子期接入后加在本任务里）。
  plugin-validate:
    name: plugin validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CLAUDE_CODE_VERSION: '2.1.321'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 Claude Code
        run: |
          for attempt in 1 2 3; do
            timeout -k 10 300 npm install -g --include=optional "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" || true
            if claude --version; then exit 0; fi
            timeout -k 10 300 node "$(npm root -g)/@anthropic-ai/claude-code/install.cjs" || true
            if claude --version; then exit 0; fi
            npm uninstall -g @anthropic-ai/claude-code || true
            npm cache clean --force || true
            sleep $((attempt * 10))
          done
          echo "::error::Claude Code ${CLAUDE_CODE_VERSION} did not install after 3 attempts."
          exit 1
      - name: 校验 marketplace
        run: claude plugin validate --strict . < /dev/null
      - name: 校验插件
        run: claude plugin validate --strict plugins/kb < /dev/null

  # 插件开发规范 C1：主干只把这一个汇总任务设为必过检查。
  # 任何一个前置任务失败、被取消或被跳过，它就失败；加任务时只需把任务名加进 needs。
  ci-required:
    name: CI required
    if: always()
    needs: [test, plugin-validate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: 汇总前置任务结果
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS" | python3 -c '
          import json, sys
          needs = json.load(sys.stdin)
          results = {name: job["result"] for name, job in needs.items()}
          print(json.dumps(results, ensure_ascii=False))
          sys.exit(0 if results and all(r == "success" for r in results.values()) else 1)
          '
