name: autopilot-degrade

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  issues:
    types: [labeled, closed]  # closed: hub slice 11, only an admin's close lifts a degrade issue

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

jobs:
  degrade:
    uses: haigeerlab/autopilot-hub/.github/workflows/degrade.yml@713a3d81f24d226e5c31c1802c0e7ab912e54812
    with:
      hub_ref: 713a3d81f24d226e5c31c1802c0e7ab912e54812
