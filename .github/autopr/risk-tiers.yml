# .github/autopr/risk-tiers.yml：继承中心的 plugin 类别模板，再加本仓库自己的路径。
# 本文件是 T4：不自动合并，由人合并。键名用 T0…T4（hub 按这些键读取）。
extends: plugin

T4:   # 守门脚本、统一检查入口与脱敏模块（脱敏守的是「知识库内容不外泄」）
  - "scripts/check-manifests.py"
  - "scripts/check_local_paths.py"
  - "scripts/validate.sh"
  - "plugins/kb/scripts/kblib/redaction.py"

T3:   # 在用户机器上运行的 hook，以及原样保留的第三方代码
  - "plugins/kb/hooks/**"
  - "plugins/kb/scripts/vendor/**"
